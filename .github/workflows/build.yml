name: Build & Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The job only reads the repository; the default token should not be able to do more.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins and fails if the two
      # disagree; --ignore-scripts keeps a dependency's install hooks from running
      # on the runner. Nothing here needs them: no native code is built.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Through the package script, so the compiler is the locked one from
      # node_modules — npx would fetch whatever is current if it were missing.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: SonarCloud Scan
        # Pinned to an immutable commit SHA rather than @master, which is a moving
        # branch anyone upstream can repoint. SHA is the v5.0.0 release tag.
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=dogs-out_client
            -Dsonar.organization=dogs-out